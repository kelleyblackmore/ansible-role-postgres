---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: instance
    image: "quay.io/ansible/molecule-${MOLECULE_DISTRO:-ubuntu:22.04}"
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: "/lib/systemd/systemd"
    networks:
      - name: molecule

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer, yaml
      stdout_callback: yaml
    ssh_connection:
      pipelining: false
  inventory:
    host_vars:
      instance:
        postgresql_databases:
          - name: test_db
        postgresql_users:
          - name: test_user
            password: test_password
            db: test_db
            priv: "test_db.*:ALL"

verifier:
  name: ansible