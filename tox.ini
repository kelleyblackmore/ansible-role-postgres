[tox]
minversion = 3.0
envlist = py{38,39,310,311}-ansible{4,5,6,7}
isolated_build = true
skip_missing_interpreters = true

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311

[testenv]
deps =
    -r{toxinidir}/requirements.txt
    ansible4: ansible>=4.0,<5.0
    ansible5: ansible>=5.0,<6.0
    ansible6: ansible>=6.0,<7.0
    ansible7: ansible>=7.0,<8.0
commands =
    yamllint .
    ansible-lint
    molecule test

[testenv:lint]
deps =
    ansible-lint
    yamllint
commands =
    yamllint .
    ansible-lint

[testenv:molecule]
deps =
    {[testenv]deps}
    molecule[docker]
commands =
    molecule test

[testenv:galaxy]
deps =
    ansible-core
commands =
    ansible-galaxy collection install community.general
    ansible-galaxy collection install ansible.posix